<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }

    .section {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .card { padding:12px; border-bottom:1px solid #ddd; }

    .priority-high { color:red; font-weight:bold; }
    .priority-medium { color:orange; font-weight:bold; }
    .priority-low { color:green; font-weight:bold; }

    .timeline { font-size:13px; margin:6px 0; }
    .status { font-weight:bold; }

    button {
      padding:6px 10px;
      border:none;
      color:#fff;
      border-radius:4px;
      cursor:pointer;
      margin-top:5px;
      margin-right:5px;
    }

    .assign { background:#28a745; }
    .filter { background:#007bff; }
    .worker { background:#6f42c1; }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<div class="section">
  <h3>🔍 Filter Issues</h3>
  <button class="filter" onclick="show('All')">All</button>
  <button class="filter" onclick="show('High')">High Priority</button>
  <button class="filter" onclick="show('Pending')">Pending</button>
  <button class="filter" onclick="show('Completed')">Completed</button>
</div>

<div class="section">
  <h3>🚦 Reported Issues</h3>
  <div id="issues"></div>
</div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];
const issuesDiv = document.getElementById("issues");
let currentFilter = "All";

function priority(issue){
  if(issue.includes("Sparking") || issue.includes("Broken")) return "High";
  if(issue.includes("Not Working")) return "Medium";
  return "Low";
}

// AUTO-ASSIGN HIGH PRIORITY
reports.forEach(r=>{
  if(priority(r.issue)==="High" && (!r.status || r.status==="Pending")){
    r.status="Assigned";
  }
});
localStorage.setItem("reports", JSON.stringify(reports));

function assign(index){
  reports[index].status = "Assigned";
  localStorage.setItem("reports", JSON.stringify(reports));
  render(currentFilter);
}

function render(filter){
  currentFilter = filter;
  issuesDiv.innerHTML="";

  reports.forEach((r,index)=>{
    const status = r.status || "Pending";
    const p = priority(r.issue);

    if(filter!=="All"){
      if(filter==="High" && p!=="High") return;
      if(filter==="Pending" && status!=="Pending") return;
      if(filter==="Completed" && status!=="Completed") return;
    }

    issuesDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>

        <b>Priority:</b>
        <span class="priority-${p.toLowerCase()}">${p}</span><br>

        <div class="timeline">
          🟢 Reported → 🔵 Assigned → 🟠 Working → ✅ Completed
        </div>

        <b>Status:</b>
        <span class="status">${status}</span><br>

        ${status==="Pending"
          ? `<button class="assign" onclick="assign(${index})">Assign</button>`
          : ``}

        <button class="worker" onclick="openWorker()">Open Worker Page</button>
      </div>
    `;
  });

  if(issuesDiv.innerHTML===""){
    issuesDiv.innerHTML="<p>No matching issues.</p>";
  }
}

function openWorker(){
  window.open("worker.html", "_blank");
}

function show(type){
  render(type);
}

render("All");
</script>

</body>
</html>
