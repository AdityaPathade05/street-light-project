<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background:#eef2f3;
      padding:20px;
    }
    h2 {
      text-align:center;
    }

    .section {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:900px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .card {
      padding:10px;
      border-bottom:1px solid #ddd;
    }

    .priority-high { color:red; font-weight:bold; }
    .priority-medium { color:orange; font-weight:bold; }
    .priority-low { color:green; font-weight:bold; }

    .status { font-weight:bold; }

    button {
      padding:5px 10px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      color:white;
      margin-right:5px;
      margin-top:5px;
    }

    .assign { background:#28a745; }
    .reassign { background:#17a2b8; }
    .delete { background:#dc3545; }

    textarea {
      width:100%;
      margin-top:5px;
    }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<div class="section">
  <h3>📋 Reported Issues</h3>
  <div id="issues"></div>
</div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];
const issuesDiv = document.getElementById("issues");

/* ---------- PRIORITY ---------- */
function getPriority(issue, danger) {
  if (danger === "Yes") return "High";
  if (issue.includes("Broken") || issue.includes("Sparking")) return "High";
  if (issue.includes("Not Working")) return "Medium";
  return "Low";
}

/* ---------- RENDER ---------- */
function render() {
  issuesDiv.innerHTML = "";

  if (reports.length === 0) {
    issuesDiv.innerHTML = "<p>No reports available.</p>";
    return;
  }

  reports.forEach(r => {
    const priority = getPriority(r.issue, r.danger);

    issuesDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}${r.comment ? " - " + r.comment : ""}<br>
        <b>Priority:</b>
        <span class="priority-${priority.toLowerCase()}">${priority}</span><br>
        <b>Status:</b> <span class="status">${r.status}</span><br>
        <b>Reported:</b> ${r.time}<br>

        <textarea id="note-${r.reportId}" placeholder="Add admin note">${r.adminNote || ""}</textarea>

        <br>

        <button class="assign" onclick="assign('${r.reportId}')">Assign</button>
        <button class="reassign" onclick="reassign('${r.reportId}')">Reassign</button>
        <button class="delete" onclick="deleteReport('${r.reportId}')">Delete</button>
      </div>
    `;
  });
}

/* ---------- ACTIONS ---------- */
function assign(id) {
  reports.forEach(r => {
    if (r.reportId === id) {
      r.status = "Assigned";
      r.adminNote = document.getElementById("note-" + id).value;
    }
  });
  save();
}

function reassign(id) {
  reports.forEach(r => {
    if (r.reportId === id) {
      r.status = "Reassigned";
      r.adminNote = document.getElementById("note-" + id).value;
    }
  });
  save();
}

function deleteReport(id) {
  if (!confirm("Delete this report permanently?")) return;
  reports = reports.filter(r => r.reportId !== id);
  save();
}

/* ---------- SAVE ---------- */
function save() {
  localStorage.setItem("reports", JSON.stringify(reports));
  render();
}

render();
</script>

</body>
</html>
