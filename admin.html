<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }

    .section {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .card {
      padding:12px;
      border-bottom:1px solid #ddd;
    }

    .priority-high { color:red; font-weight:bold; }
    .priority-medium { color:orange; font-weight:bold; }
    .priority-low { color:green; font-weight:bold; }

    .timeline { font-size:13px; margin:6px 0; }
    .status { font-weight:bold; }

    button {
      padding:6px 10px;
      border:none;
      color:#fff;
      border-radius:4px;
      cursor:pointer;
      margin-right:5px;
      margin-top:5px;
    }

    .assign { background:#28a745; }
    .reassign { background:#6c757d; }
    .delete { background:#dc3545; }
    .export { background:#007bff; }
    .call { background:#28a745; }
    .filter { background:#17a2b8; }

    input {
      width:100%;
      padding:6px;
      margin-top:6px;
    }

    img {
      width:100%;
      max-height:160px;
      object-fit:contain;
      margin-top:8px;
      border-radius:6px;
    }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<!-- Export -->
<div class="section">
  <button class="export" onclick="exportCSV()">Export Report</button>
</div>

<!-- Filter -->
<div class="section">
  <b>Filter:</b>
  <button class="filter" onclick="setFilter('All')">All</button>
  <button class="filter" onclick="setFilter('Pending')">Pending</button>
  <button class="filter" onclick="setFilter('Assigned')">Assigned</button>
  <button class="filter" onclick="setFilter('Completed')">Completed</button>
</div>

<!-- Issues -->
<div class="section">
  <h3>🚦 Reported Issues</h3>
  <div id="issues"></div>
</div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];
let currentFilter = "All";
const issuesDiv = document.getElementById("issues");

/* -------- PRIORITY -------- */
function calcPriority(issue) {
  if (issue.includes("Sparking") || issue.includes("Broken")) return "High";
  if (issue.includes("Not Working")) return "Medium";
  return "Low";
}

/* -------- TIME AGO -------- */
function timeAgo(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 60) return mins + " min ago";
  return Math.floor(mins / 60) + " hr ago";
}

/* -------- INIT -------- */
reports.forEach(r => {
  if (!r.timeStamp) r.timeStamp = Date.now();
  if (!r.status) r.status = "Pending";
  if (!r.priority) r.priority = calcPriority(r.issue);
});

localStorage.setItem("reports", JSON.stringify(reports));

/* -------- FILTER -------- */
function setFilter(type) {
  currentFilter = type;
  render();
}

/* -------- RENDER -------- */
function render() {
  issuesDiv.innerHTML = "";

  const filtered = reports.filter(
    r => currentFilter === "All" || r.status === currentFilter
  );

  if (!filtered.length) {
    issuesDiv.innerHTML = "<p>No issues found.</p>";
    return;
  }

  filtered.forEach((r, i) => {
    const issueText =
      r.issue === "Other"
        ? `Other – ${r.comment || "No description"}`
        : r.issue;

    issuesDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${issueText}<br>

        ${r.mobile ? `
          <b>Reporter Mobile:</b> ${r.mobile}
          <button class="call" onclick="callReporter('${r.mobile}')">📞 Call</button><br>
        ` : ""}

        ${r.address ? `<b>Reporter Address:</b> ${r.address}<br>` : ""}

        <b>Priority:</b>
        <span class="priority-${r.priority.toLowerCase()}">${r.priority}</span><br>

        <div class="timeline">
          🟢 Reported → 🔵 Assigned → 🟠 Working → ✅ Completed
        </div>

        <b>Status:</b> <span class="status">${r.status}</span><br>
        <b>Reported:</b> ${timeAgo(r.timeStamp)}<br>

        ${r.photo ? `<b>Reported Photo:</b><img src="${r.photo}">` : ""}
        ${r.workPhoto ? `<b>Work Completion Proof:</b><img src="${r.workPhoto}">` : ""}

        <input value="${r.adminNote || ""}"
               placeholder="Add admin note"
               onchange="addNote(${i}, this.value)">

        <br>

        <button class="assign" onclick="assign(${i})">Assign</button>
        <button class="reassign" onclick="reassign(${i})">Reassign</button>
        <button class="delete" onclick="deleteReport(${i})">Delete</button>
      </div>
    `;
  });
}

/* -------- ACTIONS -------- */
function assign(i) {
  reports[i].status = "Assigned";
  save();
}

function reassign(i) {
  reports[i].status = "Assigned";
  save();
}

function deleteReport(i) {
  if (confirm("Delete this report?")) {
    reports.splice(i, 1);
    save();
  }
}

function addNote(i, text) {
  reports[i].adminNote = text;
  save(false);
}

function save(refresh = true) {
  localStorage.setItem("reports", JSON.stringify(reports));
  if (refresh) render();
}

/* -------- CLICK TO CALL -------- */
function callReporter(number) {
  window.location.href = `tel:${number}`;
}

/* -------- EXPORT -------- */
function exportCSV() {
  let csv = "Lamp ID,Issue,Mobile,Address,Priority,Status\n";
  reports.forEach(r => {
    csv += `${r.lampId},"${r.issue}",${r.mobile || ""},"${r.address || ""}",${r.priority},${r.status}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "street_light_report.csv";
  a.click();
}

render();
</script>

</body>
</html>
