<!DOCTYPE html>
<html>
<head>
  <title>Street Light Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      padding: 20px;
    }
    h2 { text-align: center; }

    .section {
      background: white;
      padding: 15px;
      margin: 15px auto;
      max-width: 750px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .dashboard {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dash-card {
      flex: 1;
      min-width: 150px;
      background: #f5f7fa;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }

    .card {
      margin-top: 10px;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .priority-high { color: red; font-weight: bold; }
    .priority-medium { color: orange; font-weight: bold; }
    .priority-low { color: green; font-weight: bold; }

    .status-pending { color: grey; font-weight: bold; }
    .status-assigned { color: blue; font-weight: bold; }
    .status-completed { color: green; font-weight: bold; }

    .available { color: green; font-weight: bold; }
    .working { color: red; font-weight: bold; }

    button {
      border: none;
      padding: 6px 10px;
      margin-top: 6px;
      margin-right: 5px;
      cursor: pointer;
      color: white;
      border-radius: 4px;
      font-size: 13px;
    }

    .assign { background: #28a745; }
    .complete { background: #17a2b8; }
    .manager { background: #ff9800; }
    .navigate { background: #007bff; }
    .clear { background: #dc3545; }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<!-- DASHBOARD OVERVIEW -->
<div class="section">
  <h3>📊 Dashboard Overview</h3>
  <div class="dashboard">
    <div class="dash-card">Total Issues<br><span id="totalIssues">0</span></div>
    <div class="dash-card">High Priority<br><span id="highIssues">0</span></div>
    <div class="dash-card">Workers Available<br><span id="freeWorkers">0</span></div>
    <div class="dash-card">Workers Working<br><span id="busyWorkers">0</span></div>
  </div>
</div>

<!-- WORKERS -->
<div class="section">
  <h3>👷 Worker Availability</h3>
  <div id="workers"></div>
</div>

<!-- ISSUES -->
<div class="section">
  <h3>🚦 Reported Issues</h3>
  <div id="issues"></div>
</div>

<div class="section" style="text-align:center;">
  <button class="clear" onclick="clearDemo()">Clear Demo Data</button>
</div>

<script>
  let workers = JSON.parse(localStorage.getItem("workers")) || [
    { name: "Worker A", status: "Available" },
    { name: "Worker B", status: "Available" },
    { name: "Worker C", status: "Available" }
  ];
  localStorage.setItem("workers", JSON.stringify(workers));

  let reports = JSON.parse(localStorage.getItem("reports")) || [];

  function getPriority(issue) {
    if (issue.includes("Sparking") || issue.includes("Broken")) return "High";
    if (issue.includes("Not Working")) return "Medium";
    return "Low";
  }

  function priorityValue(p) {
    return p === "High" ? 1 : p === "Medium" ? 2 : 3;
  }

  reports.forEach(r => r.priority = getPriority(r.issue));
  reports.sort((a, b) => priorityValue(a.priority) - priorityValue(b.priority));

  document.getElementById("totalIssues").innerText = reports.length;
  document.getElementById("highIssues").innerText =
    reports.filter(r => r.priority === "High").length;
  document.getElementById("freeWorkers").innerText =
    workers.filter(w => w.status === "Available").length;
  document.getElementById("busyWorkers").innerText =
    workers.filter(w => w.status === "Working").length;

  const workerDiv = document.getElementById("workers");
  workers.forEach(w => {
    workerDiv.innerHTML += `
      <div class="card">
        ${w.name} –
        <span class="${w.status === "Available" ? "available" : "working"}">
          ${w.status}
        </span>
      </div>`;
  });

  const lampLocations = {
    "SL101": { lat: 18.5204, lng: 73.8567 },
    "SL102": { lat: 18.5211, lng: 73.8573 }
  };

  const issueDiv = document.getElementById("issues");
  if (reports.length === 0) issueDiv.innerHTML = "<p>No issues reported.</p>";

  reports.forEach((r, index) => {
    if (!r.status) r.status = "Pending";

    issueDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Priority:</b>
        <span class="priority-${r.priority.toLowerCase()}">${r.priority}</span><br>
        <b>Status:</b>
        <span class="status-${r.status.toLowerCase().split(' ')[0]}">${r.status}</span><br>

        <button class="assign" onclick="assignWork(${index})">Assign</button>
        <button class="complete" onclick="completeWork(${index})">Completed</button>
        <button class="manager" onclick="reportManager(${index})">Report</button>
        <button class="navigate" onclick="navigate('${r.lampId}')">Navigate</button>
      </div>`;
  });

  function assignWork(index) {
    const freeWorker = workers.find(w => w.status === "Available");
    if (!freeWorker) return alert("No workers available");

    freeWorker.status = "Working";
    reports[index].status = "Assigned";

    localStorage.setItem("workers", JSON.stringify(workers));
    localStorage.setItem("reports", JSON.stringify(reports));
    location.reload();
  }

  function completeWork(index) {
    const workingWorker = workers.find(w => w.status === "Working");
    if (workingWorker) workingWorker.status = "Available";

    reports[index].status = "Completed";
    localStorage.setItem("workers", JSON.stringify(workers));
    localStorage.setItem("reports", JSON.stringify(reports));
    location.reload();
  }

  function reportManager(index) {
    reports[index].status = "Reported to Manager";
    localStorage.setItem("reports", JSON.stringify(reports));
    location.reload();
  }

  function navigate(lampId) {
    const loc = lampLocations[lampId];
    if (!loc) return alert("Location not available");
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`);
  }

  function clearDemo() {
    localStorage.removeItem("reports");
    localStorage.removeItem("workers");
    alert("Demo data cleared");
    location.reload();
  }
</script>

</body>
</html>
