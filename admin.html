<!DOCTYPE html>
<html>
<head>
  <title>Street Light Maintenance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    .card {
      background: white;
      padding: 15px;
      margin: 10px auto;
      max-width: 500px;
      border-radius: 8px;
    }
    button {
      background: green;
      color: white;
      border: none;
      padding: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Reported Street Light Issues</h2>
<div id="list"></div>

<script>
  // Lamp ID to GPS mapping (Demo values)
  const lampLocations = {
    "SL101": { lat: 18.5204, lng: 73.8567 },
    "SL102": { lat: 18.5211, lng: 73.8573 },
    "SL103": { lat: 18.5220, lng: 73.8580 }
  };

  const list = document.getElementById("list");
  const reports = JSON.parse(localStorage.getItem("reports")) || [];

  if (reports.length === 0) {
    list.innerHTML = "<p>No issues reported.</p>";
  }

  reports.forEach(r => {
    list.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Time:</b> ${r.time}<br>
        <button onclick="navigate('${r.lampId}')">Navigate</button>
      </div>
    `;
  });

  function navigate(lampId) {
    if (!lampLocations[lampId]) {
      alert("Location not available for this Lamp ID");
      return;
    }

    const lat = lampLocations[lampId].lat;
    const lng = lampLocations[lampId].lng;

    window.open(
      `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`
    );
  }
</script>

</body>
</html>
