<!DOCTYPE html>
<html>
<head>
  // Fixed GPS location for each lamp
const lampLocations = {
  "SL101": { lat: 18.423306, lng: 73.902639 },
  "SL102": { lat: 18.423306, lng: 73.902639 }
};

  <title>Street Light Issue Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
    }
    h2 { text-align: center; }
    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Report Street Light Issue</h2>

  <!-- LAMP ID -->
  <label>Select Lamp ID</label>
  <select id="lampId">
    <option value="">Select Lamp</option>
    <option value="SL101">SL101</option>
    <option value="SL102">SL102</option>
  </select>

  <!-- ISSUE -->
  <label>Issue</label>
  <select id="issue" onchange="handleIssueChange()">
    <option value="">Select Issue</option>
    <option>Not Working</option>
    <option>Flickering</option>
    <option>Sparking</option>
    <option>Broken Pole</option>
    <option>Other</option>
  </select>

  <!-- EXTRA INPUT -->
  <div id="extraInput"></div>

  <!-- DANGER -->
  <label>Is this dangerous?</label>
  <select id="danger">
    <option>No</option>
    <option>Yes</option>
  </select>

  <!-- PHOTO -->
  <label>Upload Photo (optional)</label>
  <input type="file" accept="image/*" onchange="previewPhoto(event)">
  <img id="preview" style="width:100%;display:none;margin-top:10px">

  <button id="submitBtn" onclick="submitIssue()">Submit</button>

  <p id="msg"></p>
</div>

<script>
/* ---------- QR-BASED LAMP DETECTION ---------- */
const params = new URLSearchParams(window.location.search);
const lampFromQR = params.get("lamp");

if (lampFromQR) {
  const lampSelect = document.getElementById("lampId");
  lampSelect.value = lampFromQR;
  lampSelect.disabled = true; // lock when opened via QR
}

/* ---------- ISSUE-SPECIFIC INPUT ---------- */
function handleIssueChange() {
  const issue = document.getElementById("issue").value;
  const div = document.getElementById("extraInput");
  div.innerHTML = "";
  if (issue === "Other") {
    div.innerHTML = `<textarea id="comment" placeholder="Describe the issue"></textarea>`;
  }
}

/* ---------- PHOTO PREVIEW ---------- */
let photoData = "";
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    photoData = reader.result;
    const img = document.getElementById("preview");
    img.src = photoData;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
}

/* ---------- SUBMIT ISSUE ---------- */
function submitIssue() {
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;

  let lampId = document.getElementById("lampId").value;
  const issue = document.getElementById("issue").value;
  const danger = document.getElementById("danger").value;
  const comment = document.getElementById("comment")?.value || "";

  if (!issue) {
    alert("Please select an issue");
    btn.disabled = false;
    return;
  }

  // fallback if nothing selected/detected
  if (!lampId) {
    lampId = "Trying the ID...";
  }

  let reports = JSON.parse(localStorage.getItem("reports")) || [];

  // duplicate warning
  const existing = reports.find(
    r => r.lampId === lampId && r.status !== "Completed"
  );
  if (existing) {
    if (!confirm("This lamp is already reported. Submit again?")) {
      btn.disabled = false;
      return;
    }
  }

  const reportId = "RPT-" + Math.floor(Math.random() * 100000);

  reports.push({
    reportId,
    lampId,
    issue,
    danger,
    comment,
    photo: photoData,
    time: new Date().toLocaleString(),
    timeStamp: Date.now(),
    status: "Pending"
  });

  localStorage.setItem("reports", JSON.stringify(reports));

  document.getElementById("msg").innerHTML =
    `✅ Report Submitted<br>Report ID: <b>${reportId}</b>`;
}
</script>

</body>
</html>
