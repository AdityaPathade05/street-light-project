<!DOCTYPE html>
<html>
<head>
  <title>Street Light Issue Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .box {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
    }
    h2 { text-align: center; }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    textarea { resize: none; }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Report Street Light Issue</h2>

  <!-- Fixed Lamp -->
  <label>Lamp ID</label>
  <input type="text" value="SL101" readonly>

  <!-- Fixed Address -->
  <label>Address</label>
  <textarea readonly>Trinity Academy of Engineering, Pune</textarea>

  <!-- Mobile (MANDATORY) -->
  <label>Mobile Number</label>
  <input type="tel" id="mobile" placeholder="10-digit mobile number">

  <!-- Issue -->
  <label>Issue</label>
  <select id="issue" onchange="handleIssueChange()">
    <option value="">Select Issue</option>
    <option>Not Working</option>
    <option>Flickering</option>
    <option>Sparking</option>
    <option>Broken Pole</option>
    <option>Other</option>
  </select>

  <!-- Extra comment -->
  <div id="extraInput"></div>

  <!-- Danger -->
  <label>Is this dangerous?</label>
  <select id="danger">
    <option>No</option>
    <option>Yes</option>
  </select>

  <!-- Photo -->
  <label>Upload Photo (optional)</label>
  <input type="file" accept="image/*" onchange="previewPhoto(event)">
  <img id="preview" style="width:100%;display:none;margin-top:10px">

  <button onclick="submitIssue()">Submit</button>
  <p id="msg"></p>
</div>

<script>
const LAMP_ID = "SL101";
const ADDRESS = "Trinity Academy of Engineering, Pune";

/* Extra input for 'Other' issue */
function handleIssueChange() {
  const issue = document.getElementById("issue").value;
  const div = document.getElementById("extraInput");
  div.innerHTML = "";

  if (issue === "Other") {
    div.innerHTML =
      `<textarea id="comment" placeholder="Describe the issue"></textarea>`;
  }
}

/* Photo preview */
let photoData = "";
function previewPhoto(e) {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    photoData = reader.result;
    const img = document.getElementById("preview");
    img.src = photoData;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
}

/* Submit issue */
function submitIssue() {
  const issue = document.getElementById("issue").value;
  const danger = document.getElementById("danger").value;
  const comment = document.getElementById("comment")?.value || "";
  const mobile = document.getElementById("mobile").value.trim();

  if (!issue) {
    alert("Please select an issue");
    return;
  }

  if (!mobile || mobile.length !== 10) {
    alert("Please enter a valid 10-digit mobile number");
    return;
  }

  let reports = JSON.parse(localStorage.getItem("reports")) || [];

  reports.push({
    reportId: "RPT-" + Math.floor(Math.random() * 100000),
    lampId: LAMP_ID,
    address: ADDRESS,
    issue,
    danger,
    comment,
    mobile,
    photo: photoData,
    time: new Date().toLocaleString(),
    timeStamp: Date.now(),
    status: "Pending"
  });

  localStorage.setItem("reports", JSON.stringify(reports));
  document.getElementById("msg").innerText =
    "✅ Issue reported successfully";
}
</script>

</body>
</html>
