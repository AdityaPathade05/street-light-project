<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    .card {
      background: white;
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .priority-high { color: red; font-weight: bold; }
    .priority-medium { color: orange; font-weight: bold; }
    .priority-low { color: green; font-weight: bold; }

    button {
      border: none;
      padding: 8px 12px;
      margin-top: 10px;
      margin-right: 5px;
      cursor: pointer;
      color: white;
      border-radius: 4px;
    }
    .complete { background: #28a745; }
    .navigate { background: #007bff; }
  </style>
</head>
<body>

<h2>Worker Dashboard</h2>
<div id="tasks"></div>

<script>
  let reports = JSON.parse(localStorage.getItem("reports")) || [];
  let workers = JSON.parse(localStorage.getItem("workers")) || [];

  const taskDiv = document.getElementById("tasks");

  // Show only assigned tasks
  const assignedTasks = reports.filter(r => r.status && r.status.includes("Assigned"));

  if (assignedTasks.length === 0) {
    taskDiv.innerHTML = "<p style='text-align:center;'>No tasks assigned.</p>";
  }

  // Priority logic
  function getPriority(issue) {
    if (issue.includes("Sparking") || issue.includes("Broken")) return "High";
    if (issue.includes("Not Working")) return "Medium";
    return "Low";
  }

  const lampLocations = {
    "SL101": { lat: 18.5204, lng: 73.8567 },
    "SL102": { lat: 18.5211, lng: 73.8573 }
  };

  assignedTasks.forEach((task, index) => {
    const priority = getPriority(task.issue);
    const priorityClass = `priority-${priority.toLowerCase()}`;

    taskDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${task.lampId}<br>
        <b>Issue:</b> ${task.issue}<br>
        <b>Priority:</b>
        <span class="${priorityClass}">${priority}</span><br>
        <b>Status:</b> ${task.status}<br>

        <button class="complete" onclick="markCompleted(${index})">
          Mark Completed
        </button>

        <button class="navigate" onclick="navigate('${task.lampId}')">
          Navigate
        </button>
      </div>
    `;
  });

  function markCompleted(taskIndex) {
    const task = assignedTasks[taskIndex];
    task.status = "Completed";

    // Free one working worker
    const worker = workers.find(w => w.status === "Working");
    if (worker) worker.status = "Available";

    localStorage.setItem("reports", JSON.stringify(reports));
    localStorage.setItem("workers", JSON.stringify(workers));

    alert("Task marked as completed");
    location.reload();
  }

  function navigate(lampId) {
    const loc = lampLocations[lampId];
    if (!loc) return alert("Location not available");

    window.open(
      `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`
    );
  }
</script>

</body>
</html>
