<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }
    h3 { margin-top:30px; }

    .card {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    button {
      padding:6px 10px;
      border:none;
      border-radius:4px;
      color:#fff;
      cursor:pointer;
      margin-right:5px;
      margin-top:8px;
    }

    .nav { background:#007bff; }
    .start { background:#17a2b8; }
    .done { background:#28a745; }
  </style>
</head>

<body>

<h2>Worker Dashboard</h2>

<h3>🟠 Working / Assigned Tasks</h3>
<div id="workingTasks"></div>

<h3>✅ Completed Tasks</h3>
<div id="completedTasks"></div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];

const workingDiv = document.getElementById("workingTasks");
const completedDiv = document.getElementById("completedTasks");

function render() {
  workingDiv.innerHTML = "";
  completedDiv.innerHTML = "";

  const working = reports.filter(r => r.status === "Assigned" || r.status === "Working");
  const completed = reports.filter(r => r.status === "Completed");

  if (!working.length) workingDiv.innerHTML = "<p>No working tasks.</p>";
  if (!completed.length) completedDiv.innerHTML = "<p>No completed tasks.</p>";

  working.forEach(r => {
    workingDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Status:</b> ${r.status}<br>

        <button class="nav"
          onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${r.location.lat},${r.location.lng}','_blank')">
          Navigate to Pole
        </button>

        ${r.status !== "Working" ? `
          <button class="start" onclick="startWork('${r.reportId}')">Start Work</button>
        ` : ""}

        <button class="done" onclick="completeWork('${r.reportId}')">Mark Completed</button>

        <input type="file" id="photo-${r.reportId}" accept="image/*" style="display:none">
      </div>
    `;
  });

  completed.forEach(r => {
    completedDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Completed At:</b> ${r.completedAt || "-"}
      </div>
    `;
  });
}

function startWork(id) {
  reports.forEach(r => { if (r.reportId === id) r.status = "Working"; });
  localStorage.setItem("reports", JSON.stringify(reports));
  render();
}

function completeWork(id) {
  const input = document.getElementById(`photo-${id}`);
  input.click();

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return alert("Please upload completion photo");

    const reader = new FileReader();
    reader.onload = () => {
      reports.forEach(r => {
        if (r.reportId === id) {
          r.status = "Completed";
          r.workPhoto = reader.result;
          r.completedAt = new Date().toLocaleString();
        }
      });

      localStorage.setItem("reports", JSON.stringify(reports));
      alert("Task completed with proof photo");
      render();
    };
    reader.readAsDataURL(file);
  };
}

render();
</script>

</body>
</html>
