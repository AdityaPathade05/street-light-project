
<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }

    .card {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .status { font-weight:bold; }
    button {
      padding:6px 10px;
      border:none;
      border-radius:4px;
      color:#fff;
      cursor:pointer;
      margin-right:5px;
    }

    .start { background:#17a2b8; }
    .done { background:#28a745; }

    img {
      width:100%;
      max-height:160px;
      object-fit:contain;
      margin-top:8px;
      border-radius:6px;
    }
  </style>
</head>

<body>

<h2>Worker Dashboard</h2>

<div id="tasks"></div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];
const tasksDiv = document.getElementById("tasks");

/* -------- RENDER TASKS -------- */
function render() {
  tasksDiv.innerHTML = "";

  const tasks = reports.filter(
    r => r.status === "Assigned" || r.status === "Reassigned"
  );

  if (tasks.length === 0) {
    tasksDiv.innerHTML = "<p>No assigned tasks.</p>";
    return;
  }

  tasks.forEach((r, i) => {
    const issueText =
      r.issue === "Other"
        ? `Other – ${r.comment || "No description provided"}`
        : r.issue;

    tasksDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${issueText}<br>
        <b>Priority:</b> ${r.priority}<br>
        <b>Status:</b> <span class="status">${r.status}</span><br>

        ${r.photo ? `<img src="${r.photo}">` : ""}

        <br><br>

        <button class="start" onclick="startWork('${r.lampId}')">
          Start Work
        </button>

        <button class="done" onclick="completeWork('${r.lampId}')">
          Mark Completed
        </button>
      </div>
    `;
  });
}

/* -------- ACTIONS -------- */
function startWork(lampId) {
  reports.forEach(r => {
    if (r.lampId === lampId) {
      r.status = "Working";
    }
  });
  localStorage.setItem("reports", JSON.stringify(reports));
  render();
}

function completeWork(lampId) {
  reports.forEach(r => {
    if (r.lampId === lampId) {
      r.status = "Completed";
    }
  });
  localStorage.setItem("reports", JSON.stringify(reports));
  alert("Task completed");
  render();
}

render();
</script>

</body>
</html>
