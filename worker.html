<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }

    .card {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    button {
      padding:6px 10px;
      border:none;
      border-radius:4px;
      color:#fff;
      cursor:pointer;
      margin-top:8px;
      margin-right:5px;
    }

    .start { background:#17a2b8; }
    .done { background:#28a745; }
    .nav { background:#007bff; }
    .call { background:#28a745; }

    img {
      width:100%;
      max-height:150px;
      object-fit:contain;
      margin-top:8px;
      border-radius:6px;
    }
  </style>
</head>

<body>

<h2>Worker Dashboard</h2>

<h3>🟠 Assigned / Working Tasks</h3>
<div id="working"></div>

<h3>✅ Completed Tasks</h3>
<div id="completed"></div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];

const workingDiv = document.getElementById("working");
const completedDiv = document.getElementById("completed");

/* ---------- RENDER ---------- */
function render() {
  workingDiv.innerHTML = "";
  completedDiv.innerHTML = "";

  const working = reports.filter(r =>
    r.status === "Assigned" || r.status === "Working"
  );

  const completed = reports.filter(r =>
    r.status === "Completed"
  );

  if (!working.length) workingDiv.innerHTML = "<p>No assigned tasks.</p>";
  if (!completed.length) completedDiv.innerHTML = "<p>No completed tasks.</p>";

  working.forEach(r => {
    workingDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>

        ${r.address ? `<b>Address:</b> ${r.address}<br>` : ""}

        ${r.mobile ? `
          <b>Reporter Mobile:</b> ${r.mobile}
          <button class="call" onclick="call('${r.mobile}')">📞 Call</button><br>
        ` : ""}

        ${r.photo ? `
          <b>Reported Photo:</b><br>
          <img src="${r.photo}">
        ` : ""}

        <button class="nav"
          onclick="navigate(${r.location?.lat || 18.423306},
                             ${r.location?.lng || 73.902639})">
          Navigate to Pole
        </button>

        ${r.status !== "Working" ? `
          <button class="start" onclick="startWork('${r.reportId}')">
            Start Work
          </button>
        ` : ""}

        <button class="done" onclick="completeWork('${r.reportId}')">
          Mark Completed
        </button>

        <input type="file"
               id="photo-${r.reportId}"
               accept="image/*"
               style="display:none">
      </div>
    `;
  });

  completed.forEach(r => {
    completedDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Completed At:</b> ${r.completedAt || "-"}<br>

        ${r.workPhoto ? `
          <b>Completion Photo:</b><br>
          <img src="${r.workPhoto}">
        ` : ""}
      </div>
    `;
  });
}

/* ---------- ACTIONS ---------- */
function startWork(id) {
  reports.forEach(r => {
    if (r.reportId === id) r.status = "Working";
  });
  save();
}

function completeWork(id) {
  const input = document.getElementById(`photo-${id}`);
  input.click();

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return alert("Please upload completion photo");

    const reader = new FileReader();
    reader.onload = () => {
      reports.forEach(r => {
        if (r.reportId === id) {
          r.status = "Completed";
          r.workPhoto = reader.result;
          r.completedAt = new Date().toLocaleString();
        }
      });
      save();
      alert("Work marked completed");
    };
    reader.readAsDataURL(file);
  };
}

/* ---------- HELPERS ---------- */
function call(number) {
  window.location.href = `tel:${number}`;
}

function navigate(lat, lng) {
  window.open(
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
    "_blank"
  );
}

function save() {
  localStorage.setItem("reports", JSON.stringify(reports));
  render();
}

render();
</script>

</body>
</html>
