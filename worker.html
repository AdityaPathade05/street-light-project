<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef2f3; padding:20px; }
    h2 { text-align:center; }
    h3 { margin-top:30px; }

    .card {
      background:#fff;
      padding:15px;
      margin:15px auto;
      max-width:800px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .status { font-weight:bold; }

    button {
      padding:6px 10px;
      border:none;
      border-radius:4px;
      color:#fff;
      cursor:pointer;
      margin-right:5px;
      margin-top:8px;
    }

    .start { background:#17a2b8; }
    .done { background:#28a745; }
    .nav { background:#007bff; }
  </style>
</head>

<body>

<h2>Worker Dashboard</h2>

<h3>🟠 Working / Assigned Tasks</h3>
<div id="workingTasks"></div>

<h3>✅ Completed Tasks</h3>
<div id="completedTasks"></div>

<script>
let reports = JSON.parse(localStorage.getItem("reports")) || [];

const workingDiv = document.getElementById("workingTasks");
const completedDiv = document.getElementById("completedTasks");

/* ---------- RENDER ---------- */
function render() {
  workingDiv.innerHTML = "";
  completedDiv.innerHTML = "";

  const working = reports.filter(
    r => r.status === "Assigned" || r.status === "Working"
  );
  const completed = reports.filter(r => r.status === "Completed");

  if (!working.length) workingDiv.innerHTML = "<p>No working tasks.</p>";
  if (!completed.length) completedDiv.innerHTML = "<p>No completed tasks.</p>";

  working.forEach(r => {
    workingDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Status:</b> <span class="status">${r.status}</span><br>

        <button class="nav"
          onclick="navigateToPole(${r.location?.lat || null}, ${r.location?.lng || null})">
          Navigate to Pole
        </button>

        ${r.status !== "Working" ? `
          <button class="start" onclick="startWork('${r.reportId}')">
            Start Work
          </button>` : ""}

        <button class="done" onclick="completeWork('${r.reportId}')">
          Mark Completed
        </button>
      </div>
    `;
  });

  completed.forEach(r => {
    completedDiv.innerHTML += `
      <div class="card">
        <b>Lamp ID:</b> ${r.lampId}<br>
        <b>Issue:</b> ${r.issue}<br>
        <b>Status:</b> <span class="status">${r.status}</span>
      </div>
    `;
  });
}

/* ---------- ACTIONS ---------- */
function startWork(id) {
  reports.forEach(r => { if (r.reportId === id) r.status = "Working"; });
  localStorage.setItem("reports", JSON.stringify(reports));
  render();
}

function completeWork(id) {
  reports.forEach(r => { if (r.reportId === id) r.status = "Completed"; });
  localStorage.setItem("reports", JSON.stringify(reports));
  alert("Task completed");
  render();
}

/* ---------- SMART NAVIGATION ---------- */
function navigateToPole(lat, lng) {
  if (lat && lng) {
    // exact navigation
    window.open(
      `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
      "_blank"
    );
  } else {
    // fallback to worker current location
    navigator.geolocation.getCurrentPosition(
      pos => {
        alert(
          "Exact pole GPS not available.\nNavigating from your current location."
        );
        window.open(
  `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${lat},${lng}`,
  "_blank"
);

      },
      () => {
        alert("Location access denied. Please enable GPS.");
      }
    );
  }
}

render();
</script>

</body>
</html>
